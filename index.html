<!DOCTYPE html>
<html lang="ja" data-theme="bijou">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="カラコン手帳">
<meta name="apple-mobile-web-app-title" content="カラコン手帳">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b0d22">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>カラコン手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EAF6FB;--bg-soft:#F5FBFD;--card:#FFF;--text:#274357;--text-soft:#6C8A9C;--accent:#4FB6D9;--accent-deep:#2E9CC2;--accent-soft:#D7F0F8;--border:#D3ECF4;--danger:#E8788F;--shadow:rgba(79,182,217,.16)}
:root[data-theme="mono"]{--bg:#F4F4F4;--bg-soft:#FAFAFA;--text:#2A2A2A;--text-soft:#8A8A8A;--accent:#2A2A2A;--accent-deep:#000;--accent-soft:#E8E8E8;--border:#E2E2E2;--shadow:rgba(0,0,0,.08)}
:root[data-theme="pink"]{--bg:#FFF1F6;--bg-soft:#FFF8FA;--text:#6B2C4A;--text-soft:#B57E97;--accent:#FF8FAB;--accent-deep:#F2618A;--accent-soft:#FFE1EB;--border:#FBD5E2;--shadow:rgba(255,143,171,.2)}
:root[data-theme="dark"]{--bg:#14191D;--bg-soft:#1B2126;--card:#1E262C;--text:#E7F1F6;--text-soft:#8CA3AF;--accent:#5FCBEF;--accent-deep:#4FB6D9;--accent-soft:#223138;--border:#2A343B;--shadow:rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:"M PLUS Rounded 1c",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;padding:14px 16px 10px;background:var(--bg);border-bottom:1px solid var(--border)}
.head-row{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:18px;font-weight:800}h1 span{color:var(--accent-deep)}
.theme-row{display:flex;gap:7px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0}
.swatch[data-t=mizuiro]{background:linear-gradient(135deg,#4FB6D9,#D7F0F8)}.swatch[data-t=mono]{background:linear-gradient(135deg,#2A2A2A,#E8E8E8)}
.swatch[data-t=pink]{background:linear-gradient(135deg,#FF8FAB,#FFE1EB)}.swatch[data-t=dark]{background:linear-gradient(135deg,#14191D,#5FCBEF)}
.swatch.active{border-color:var(--accent-deep)}
.search{width:100%;margin-top:10px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:9px 12px;font-family:inherit;font-size:13px;color:var(--text)}
main{padding:10px 12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:0 1px 6px var(--shadow)}
.row-main{display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer}
.thumb{width:54px;height:54px;flex:none;border-radius:50%;background:var(--accent-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--border)}
.thumb img{width:100%;height:100%;object-fit:cover}
.noimg{font-size:9px;color:var(--text-soft);font-weight:700;line-height:1.25;text-align:center}
.grp{font-size:12px;font-weight:800;color:var(--accent-deep);margin:10px 4px 0}
.info{min-width:0;flex:1}
.t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:11px;color:var(--text-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec{font-size:10.5px;color:var(--text-soft);margin-top:3px;line-height:1.4}
.tag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent-deep);margin-left:4px;vertical-align:1px}
.tag.warn{background:#FFE3D6;color:#C25A2C}.tag.dead{background:#EEE;color:#999}
.stock{flex:none;display:flex;flex-direction:column;gap:4px}
.st{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text-soft)}
.st b{min-width:16px;text-align:center;font-size:13px;color:var(--text)}
.st button{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--bg-soft);color:var(--accent-deep);font-size:14px;line-height:1;cursor:pointer;padding:0}
.empty{text-align:center;padding:44px 16px;color:var(--text-soft);font-size:13px;line-height:1.7}
.sheet-overlay{position:fixed;inset:0;background:rgba(20,25,29,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-overlay.open{display:flex}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto}
.sheet h2{margin:0 0 12px;font-size:15px}
.field{margin-bottom:10px}.field label{display:block;font-size:11px;color:var(--text-soft);margin-bottom:4px;font-weight:700}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);background:var(--bg-soft);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13px;color:var(--text)}
.field textarea{min-height:50px;resize:vertical}
.field input[type=file]{padding:7px;font-size:11px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pv{width:100%;height:70px;object-fit:cover;border-radius:10px;margin-top:5px;border:1px solid var(--border)}
.own{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:4px 0 12px}
.own input{width:18px;height:18px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:4px}
.b1,.b2,.b3{flex:1;border:none;border-radius:12px;padding:11px 0;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.b1{background:var(--accent);color:#fff}.b2{background:var(--bg-soft);color:var(--text-soft);border:1px solid var(--border)}
.b3{background:transparent;color:var(--danger);border:1px solid var(--danger);flex:none;padding:11px 14px}
.fh{display:flex;gap:6px;align-items:center;margin:0 2px 8px}.fbtn{border:1px solid var(--border);background:var(--card);color:var(--accent-deep);border-radius:99px;padding:5px 12px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}.cnt{margin-left:auto;font-size:11px;color:var(--text-soft)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.fl{font-size:10px;color:var(--text-soft);font-weight:700}.fl select{width:100%;margin-top:2px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:7px 8px;font-family:inherit;font-size:12px;color:var(--text)}
.grp{display:flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:10px;padding:7px 10px;margin:8px 0 0;cursor:pointer;user-select:none}.grp2{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--text-soft);padding:6px 6px 0 14px;cursor:pointer;user-select:none}.gc{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--text-soft)}
.cd{aspect-ratio:auto;min-height:62px}.cd small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;width:100%;font-size:8px;line-height:1.25;color:var(--text-soft);text-align:center;overflow:hidden;word-break:break-all;margin-top:1px}
.bkb{border:none;background:none;font-size:17px;cursor:pointer;padding:0 0 0 4px}
.calc{background:var(--bg-soft);border:1px dashed var(--border);border-radius:12px;padding:10px;margin-bottom:10px}.cl{font-size:11px;font-weight:800;color:var(--accent-deep);margin-bottom:6px}.cr{font-size:12.5px;font-weight:700;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chip{border:1px solid var(--border);background:var(--bg-soft);color:var(--text-soft);border-radius:99px;padding:3px 10px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 8px}.cal-h button{border:1px solid var(--border);background:var(--card);color:var(--accent-deep);border-radius:10px;padding:5px 12px;cursor:pointer;font-family:inherit}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.wd{text-align:center;font-size:10px;color:var(--text-soft);font-weight:700}
.cd{position:relative;min-height:104px;background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:3px;cursor:pointer;font-size:10px;overflow:hidden}.cd img{width:70%;aspect-ratio:1;object-fit:cover;border-radius:50%;margin-top:1px}.cd i{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:4px}.cd em{position:absolute;right:3px;bottom:2px;font-style:normal;font-size:8.5px;color:var(--accent-deep);font-weight:800}
.pick{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--border);font-size:13px}.pick input{width:18px;height:18px;accent-color:var(--accent)}.pick .thumb{width:38px;height:38px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;display:flex;justify-content:center}
.nv{max-width:480px;width:100%;display:flex}
.nv button{flex:1;border:none;background:transparent;padding:10px 0 8px;font-family:inherit;color:var(--text-soft);font-size:10.5px;font-weight:700;cursor:pointer}
.nv button span{display:block;font-size:17px;margin-bottom:1px}.nv button.active{color:var(--accent-deep)}

.swatch[data-t=bijou]{background:linear-gradient(135deg,#2a1230,#ff8fc8 60%,#c56bff)}
#spk{display:none;position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
:root[data-theme=bijou] #spk{display:block}
.sp{position:absolute;font-style:normal;color:#fff;text-shadow:0 0 6px #ff9fd8,0 0 12px #c58bff;opacity:0;animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(20deg)}}
@media(prefers-reduced-motion:reduce){.sp{animation:none;opacity:.5}}
:root[data-theme=bijou]{color-scheme:dark;--bg:#1b0d22;--bg-soft:rgba(255,255,255,.09);--card:rgba(32,14,40,.74);--text:#fff0f8;--text-soft:#e0bfd6;--accent:#ff8fc8;--accent-deep:#ffb6df;--accent-soft:rgba(255,143,200,.2);--border:rgba(255,205,232,.32);--danger:#ff9eb5;--shadow:rgba(255,110,190,.3)}

:root[data-theme=bijou] .sheet{background:rgba(30,14,38,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:2px dotted rgba(255,225,242,.6)}
:root[data-theme=bijou] nav{background:rgba(26,10,32,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1.5px dotted rgba(255,220,240,.55)}
:root[data-theme=bijou] .nv button.active{text-shadow:0 0 10px #ff9fd8,0 0 4px #fff}
:root[data-theme=bijou] select option{background:#2a1530;color:#fff}
</style>
</head>
<body>
<div id="spk" aria-hidden="true"></div>
<div class="app">
<header>
  <div class="head-row"><h1>カラコン<span>手帳</span> 💎</h1>
  <div class="theme-row"><button class="bkb" id="bk" title="バックアップ">💾</button></div></div>
  <input class="search" id="q" placeholder="ブランド・シリーズ・色の名前で検索">
</header>
<main><div id="fbar"></div><div class="list" id="list"></div></main>
</div>

<nav><div class="nv">
  <button data-tab="mine" class="active"><span>📦</span>所有中</button>
  <button data-tab="all"><span>📖</span>図鑑</button>
  <button data-tab="cal"><span>📅</span>着用</button>
  <button data-tab="add"><span>＋</span>登録</button>
</div></nav>

<div class="sheet-overlay" id="lb" style="align-items:center;z-index:30;background:rgba(0,0,0,.85)"><div id="lbBody" style="width:100%;max-width:480px;padding:16px;max-height:92vh;overflow-y:auto"></div></div>
<div class="sheet-overlay" id="bo"><div class="sheet"><h2>バックアップ・復元</h2><div class="spec" style="margin-bottom:8px;line-height:1.6">データはこの端末のこのブラウザ内に保存されてるよ。機種変更やブラウザのデータ削除の前に「コピー」して、メモ帳などに貼り付けて残しておいてね。復元するときは下の欄に貼り付けて「復元」を押してね。</div><textarea id="boT" style="width:100%;min-height:120px;border:1px solid var(--border);background:var(--bg-soft);border-radius:10px;padding:9px;font-size:11px;color:var(--text);font-family:inherit"></textarea><div class="actions" style="margin-top:10px"><button class="b2" id="boCopy">コピー</button><button class="b1" id="boRestore">復元</button></div><div class="spec" id="boMsg" style="margin-top:8px;line-height:1.6"></div><div class="actions" style="margin-top:8px"><button class="b2" id="boClose">とじる</button></div></div></div>
<div class="sheet-overlay" id="dv"><div class="sheet"><h2 id="dvT"></h2><div id="dvTop"><input id="dvQ" placeholder="検索(ブランド・シリーズ・色)" style="width:100%;border:1px solid var(--border);background:var(--bg-soft);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:13px;color:var(--text);margin-bottom:8px"><div class="chips" style="margin:0 0 6px"><button type="button" class="chip on" id="dvOwn">所持中</button><button type="button" class="chip" id="dvAllB">すべて</button></div></div><div id="dvL"></div><div class="actions" style="margin-top:12px"><button class="b2" id="dvEdit" style="display:none">修正する</button><button class="b1" id="dvOk">とじる</button></div></div></div>
<div class="sheet-overlay" id="ov"><div class="sheet">
  <h2 id="sTitle">カラコンを登録</h2>
  <div class="g2">
    <div class="field"><label>ブランド</label><input id="fBrand"></div>
    <div class="field"><label>シリーズ</label><input id="fSeries"></div>
  </div>
  <div class="field"><label>色の名前</label><input id="fColor" placeholder="例: ミルクティー"></div>
  <div class="g3">
    <div class="field"><label>BC</label><input id="fBC" placeholder="8.6"></div>
    <div class="field"><label>直径(DIA)</label><input id="fDia" placeholder="14.2"></div>
    <div class="field"><label>着色直径</label><input id="fCDia" placeholder="13.4"></div>
  </div>
  <div class="g2">
    <div class="field"><label>装用期間</label><select id="fPeriod"><option value="">未設定</option><option>ワンデー</option><option>2week</option><option>1month</option><option>それ以上</option></select></div>
    <div class="field"><label>使用期限</label><input id="fExp" type="date"></div>
  </div>
  <div class="g2">
    <div class="field"><label>度数 左 / 右</label><div class="g2"><input id="fPL" type="number" step="0.25" placeholder="左"><input id="fPR" type="number" step="0.25" placeholder="右"></div></div>
    <div class="field"><label>在庫 左 / 右</label><div class="g2"><input id="fSL" type="number" min="0" placeholder="左"><input id="fSR" type="number" min="0" placeholder="右"></div></div>
  </div>
  <div class="g2"><div class="field"><label>色系統</label><select id="fHue"></select></div><div class="field"><label>素材</label><select id="fMat"></select></div></div>
  <div class="g2"><div class="field"><label>メーカー</label><input id="fMaker"></div><div class="field"><label>購入先</label><input id="fShop"></div></div>
  <div class="g2"><div class="field"><label>価格(1箱・円)</label><input id="fPrice" type="number" min="0"></div><div class="field"><label>入数(枚)</label><input id="fPcs" type="number" min="0"></div></div>
  <div class="calc"><div class="cl">価格計算機</div><div class="g3"><div class="field"><label>買う箱数</label><input id="cN" type="number" min="1" value="1"></div><div class="field"><label>おまけ箱数</label><input id="cM" type="number" min="0" value="0"></div><div class="field"><label>割引(%)</label><input id="cO" type="number" min="0" max="100" value="0"></div></div><div class="cr" id="cR"></div></div>
  <div class="field"><label>デザインタグ(カンマ区切りで自由入力もOK)</label><input id="fTags"><div class="chips" id="chips"></div><div class="g2" style="margin-top:8px"><input id="fNewTag" placeholder="新しいタグ"><button type="button" class="b2" id="addTag" style="padding:9px 0">追加して保存</button></div></div>
  <label class="own"><input type="checkbox" id="fOwn" checked>所有中(チェックを外すと図鑑だけに登録)</label>
  <div class="field"><label>パッケージ・レンズデザインのメモ</label><textarea id="fPkg"></textarea></div>
  <div class="field"><label>メモ・使用感</label><textarea id="fNote"></textarea></div>
  <div class="g2">
    <div class="field"><label>レンズ画像(アイコンになるよ)</label><input type="file" id="fI1" accept="image/*"><img class="pv" id="pv1" style="display:none"></div>
    <div class="field"><label>着用イメモ</label><input type="file" id="fI2" accept="image/*"><img class="pv" id="pv2" style="display:none"></div>
  </div>
  <div class="actions"><button class="b2" id="cancel">キャンセル</button><button class="b3" id="del" style="display:none">削除</button><button class="b1" id="save">保存</button></div>
</div></div>

<script>
(function(){
var K='karakon_items_v2',TK='karakon_theme_v1',items=[],tab='mine',editId=null,img1=null,img2=null,delArmed=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){
  try{var r=localStorage.getItem(K);if(r){items=JSON.parse(r);return}}catch(e){}
  try{var o=JSON.parse(localStorage.getItem('karakon_items_v1')||'[]');
    items=o.map(function(x){return{id:x.id,brand:x.brand||'',series:x.series||'',color:x.color||x.name||'',bc:'',dia:x.dia||'',cdia:'',period:'',exp:x.expiry||'',pl:x.powerL,pr:x.powerR,sl:x.left,sr:x.right,own:x.kind!=='dict',pkg:x.pkg||'',note:x.note||'',i1:x.imgLens||null,i2:x.imgWorn||null}})}catch(e){items=[]}
}
function persist(){try{localStorage.setItem(K,JSON.stringify(items))}catch(e){alert('保存容量がいっぱいかも…画像を減らしてね')}}
function setTheme(t){if(t==='mizuiro')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.swatch').forEach(function(s){s.classList.toggle('active',s.dataset.t===t)});try{localStorage.setItem(TK,t)}catch(e){}}
document.querySelectorAll('.swatch').forEach(function(s){s.onclick=function(){setTheme(s.dataset.t)}});
function days(d){if(!d)return null;var n=new Date();n.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-n)/864e5)}
function fmtP(v){return v==null?'-':(v>0?'+':'')+Number(v).toFixed(2)}
function render(){
  $('q').style.display=tab==='cal'?'none':'block';
  if(tab==='cal'){$('fbar').innerHTML='';renderCal();return}
  renderFilter();
  var q=$('q').value.trim().toLowerCase(),box=$('list');
  var rows=items.filter(function(it){
    if(tab==='mine'&&!it.own)return false;
    if(!passF(it))return false;
    return !q||(it.brand+it.series+it.color+(it.tags||'')+(it.maker||'')+(it.shop||'')).toLowerCase().indexOf(q)>-1});
  if(!rows.length){box.innerHTML='<div class="empty">'+(tab==='mine'?'🧴<br>まだ所有中のカラコンがないよ〜<br>下の「＋登録」から追加してね':'📖<br>図鑑はまだ空っぽ〜<br>下の「＋登録」から追加してね')+'</div>';return}
  if(tab==='all')rows=rows.slice().sort(function(a,b){var x=a.brand||'\uffff',y=b.brand||'\uffff';return x===y?0:x.localeCompare(y,'ja')});
  var lastB=null,lastS=null,forced=!!q||Object.keys(F).some(function(k){return F[k]}),cB={},cS={};
  if(tab==='all'){rows=rows.slice().sort(function(a,b){var d=cmpB(a.brand||'',b.brand||'');return d?d:cmpS(a.series||'',b.series||'')});
    rows.forEach(function(it){var b=it.brand||'ブランド未設定',s=it.series||'';cB[b]=(cB[b]||0)+1;if(s)cS[b+'|'+s]=(cS[b+'|'+s]||0)+1})}
  box.innerHTML=rows.map(function(it){
    var hd='',skip=false;
    if(tab==='all'){var bn=it.brand||'ブランド未設定',sn=it.series||'',kb='b:'+bn,ks='s:'+bn+'|'+sn;
      if(bn!==lastB){lastB=bn;lastS=null;hd+='<div class="grp" data-fg="'+esc(kb)+'"><span>'+(!forced&&fold[kb]?'▶':'▼')+'</span> '+esc(bn)+'<span class="gc">'+cB[bn]+'件</span></div>'}
      if(!forced&&fold[kb])skip=true;
      else if(sn){if(sn!==lastS){lastS=sn;hd+='<div class="grp2" data-fg="'+esc(ks)+'"><span>'+(!forced&&fold[ks]?'▶':'▼')+'</span> '+esc(sn)+'<span class="gc">'+cS[bn+'|'+sn]+'件</span></div>'}if(!forced&&fold[ks])skip=true}}
    if(skip)return hd;
    var badge='';
    if(it.own){var d=days(it.exp);if(d!==null)badge=d<0?'<span class="tag dead">期限切れ</span>':d<=14?'<span class="tag warn">残り'+d+'日</span>':''}
    else badge='<span class="tag dead">図鑑</span>';
    if(tab==='all'&&it.own)badge+='<span class="tag">所有中</span>';
    var sp=[];
    if(it.dia)sp.push('DIA '+esc(it.dia));if(it.cdia)sp.push('着色 '+esc(it.cdia));if(it.bc)sp.push('BC '+esc(it.bc));if(it.period)sp.push(esc(it.period));
    if(it.pl!=null||it.pr!=null)sp.push((it.pl===0&&it.pr===0)?'度なし':'度数 '+fmtP(it.pl)+' / '+fmtP(it.pr));
    if(it.hue)sp.push(esc(it.hue));if(it.mat)sp.push(esc(it.mat));if(it.price)sp.push('¥'+Number(it.price).toLocaleString());if(it.shop)sp.push(esc(it.shop));
    var tg=it.tags?'<div class="spec">'+it.tags.split(',').filter(Boolean).map(function(x){return '<span class="tag" style="margin:0 3px 0 0">'+esc(x)+'</span>'}).join('')+'</div>':'';
    var th=it.i1?'<img src="'+it.i1+'" alt="">':'<span class="noimg">画像<br>なし</span>';
    var st=it.own?'<div class="stock"><div class="st">L<button data-s="'+it.id+'" data-k="sl" data-d="-1">−</button><b>'+(it.sl||0)+'</b><button data-s="'+it.id+'" data-k="sl" data-d="1">＋</button></div>'+
      '<div class="st">R<button data-s="'+it.id+'" data-k="sr" data-d="-1">−</button><b>'+(it.sr||0)+'</b><button data-s="'+it.id+'" data-k="sr" data-d="1">＋</button></div></div>':'';
    return hd+'<div class="row"><div class="row-main" data-e="'+it.id+'"><div class="thumb"'+((it.i1||it.i2)?' data-im="'+it.id+'"':'')+'>'+th+'</div><div class="info"><div class="t">'+esc(it.color||it.brand||'(名前なし)')+badge+'</div><div class="s">'+esc([it.brand,it.series].filter(Boolean).join(' · '))+'</div><div class="spec">'+sp.join(' · ')+'</div>'+tg+'</div></div>'+st+'</div>'}).join('');
}
$('list').addEventListener('click',function(e){
  var b=e.target.closest('[data-s]');
  if(b){var it=items.find(function(x){return x.id===b.dataset.s});if(it){it[b.dataset.k]=Math.max(0,(it[b.dataset.k]||0)+Number(b.dataset.d));persist();render()}return}
  var fg=e.target.closest('[data-fg]');if(fg){toggleFold(fg.dataset.fg);return}
  var im=e.target.closest('[data-im]');if(im){openImg(im.dataset.im);return}
  var m=e.target.closest('[data-e]');if(m)openSheet(m.dataset.e);
});
$('q').oninput=render;
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){
  if(b.dataset.tab==='add'){openSheet(null);return}
  tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('active',x.dataset.tab===tab)});render()}});
function small(file,cb){var r=new FileReader();r.onload=function(e){var im=new Image();im.onload=function(){var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};im.src=e.target.result};r.readAsDataURL(file)}
function bindImg(inp,pv,set){inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;small(f,function(d){set(d);pv.src=d;pv.style.display='block'})}}
bindImg($('fI1'),$('pv1'),function(d){img1=d});bindImg($('fI2'),$('pv2'),function(d){img2=d});
function num(id){var v=$(id).value;return v===''?null:Number(v)}
function openSheet(id){
  editId=id;delArmed=false;$('del').textContent='削除';
  var it=id?items.find(function(x){return x.id===id}):null;
  $('sTitle').textContent=it?'編集':'カラコンを登録';$('del').style.display=it?'block':'none';
  var o=it||{own:tab==='mine'};
  $('fBrand').value=o.brand||'';$('fSeries').value=o.series||'';$('fColor').value=o.color||'';$('fBC').value=o.bc||'';$('fDia').value=o.dia||'';$('fCDia').value=o.cdia||'';
  $('fPeriod').value=o.period||'';$('fExp').value=o.exp||'';
  $('fPL').value=o.pl==null?'':o.pl;$('fPR').value=o.pr==null?'':o.pr;$('fSL').value=o.sl==null?'':o.sl;$('fSR').value=o.sr==null?'':o.sr;
  $('fHue').value=o.hue||'';$('fMat').value=o.mat||'';$('fMaker').value=o.maker||'';$('fShop').value=o.shop||'';$('fPrice').value=o.price==null?'':o.price;$('fPcs').value=o.pcs==null?'':o.pcs;$('fTags').value=o.tags||'';calc();chipSync();
  $('fOwn').checked=!!o.own;$('fPkg').value=o.pkg||'';$('fNote').value=o.note||'';
  img1=o.i1||null;img2=o.i2||null;$('fI1').value='';$('fI2').value='';
  [['pv1',img1],['pv2',img2]].forEach(function(p){var e=$(p[0]);e.style.display=p[1]?'block':'none';if(p[1])e.src=p[1]});
  $('ov').classList.add('open');
}
function close(){$('ov').classList.remove('open')}
$('cancel').onclick=close;$('ov').onclick=function(e){if(e.target===$('ov'))close()};
$('del').onclick=function(){if(!delArmed){delArmed=true;$('del').textContent='本当に削除?';return}
  items=items.filter(function(x){return x.id!==editId});persist();close();render()};
$('save').onclick=function(){
  var brand=$('fBrand').value.trim(),color=$('fColor').value.trim();
  if(!brand&&!color){$('fBrand').focus();return}
  var o={id:editId||('i'+Date.now()+Math.random().toString(36).slice(2,6)),brand:brand,series:$('fSeries').value.trim(),color:color,
    bc:$('fBC').value.trim(),dia:$('fDia').value.trim(),cdia:$('fCDia').value.trim(),period:$('fPeriod').value,exp:$('fExp').value,
    pl:num('fPL'),pr:num('fPR'),sl:num('fSL'),sr:num('fSR'),own:$('fOwn').checked,maker:$('fMaker').value.trim(),shop:$('fShop').value.trim(),price:num('fPrice'),pcs:num('fPcs'),tags:learnTags().join(','),hue:$('fHue').value,mat:$('fMat').value,pkg:$('fPkg').value.trim(),note:$('fNote').value.trim(),i1:img1,i2:img2};
  if(editId){items=items.map(function(x){return x.id===editId?o:x})}else items.unshift(o);
  persist();close();tab=o.own?'mine':'all';
  document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('active',x.dataset.tab===tab)});render();
};
var PRESET=['地雷系','ギャル系','ナチュラル','盛れ系','縁くっきり','縁ふんわり','太フチ','細フチ','縁なし','ハーフ風','透明感'];
var TLK='karakon_tags_v1',custom=[];try{custom=JSON.parse(localStorage.getItem(TLK)||'[]')}catch(e){custom=[]}
function saveCustom(){try{localStorage.setItem(TLK,JSON.stringify(custom))}catch(e){}}
function allTags(){return PRESET.concat(custom)}
function curTags(){return $('fTags').value.split(/[,、]/).map(function(s){return s.trim()}).filter(Boolean)}
function chipSync(){var c=curTags();$('chips').innerHTML=allTags().map(function(p){var cu=custom.indexOf(p)>-1;return '<button type="button" class="chip'+(c.indexOf(p)>-1?' on':'')+'" data-ch="'+esc(p)+'">'+esc(p)+(cu?' <span data-cx="'+esc(p)+'">×</span>':'')+'</button>'}).join('')}
$('chips').addEventListener('click',function(e){var p=e.target.dataset.ch;if(!p)return;var c=curTags(),i=c.indexOf(p);if(i>-1)c.splice(i,1);else c.push(p);$('fTags').value=c.join(',');chipSync()});
$('fTags').oninput=chipSync;
function calc(){var p=num('fPrice'),n=Math.max(1,num('cN')||1),m=Math.max(0,num('cM')||0),o=Math.min(100,Math.max(0,num('cO')||0));
  if(!p){$('cR').textContent='価格を入れると計算するよ';return}
  var tot=p*n*(1-o/100),per=tot/(n+m),pc=num('fPcs');
  $('cR').textContent='合計 ¥'+Math.round(tot).toLocaleString()+' / '+(n+m)+'箱 → 1箱 ¥'+Math.round(per).toLocaleString()+(pc?'(1枚 ¥'+Math.round(per/pc).toLocaleString()+')':'')}
['fPrice','fPcs','cN','cM','cO'].forEach(function(i){$(i).oninput=calc});
var WK='karakon_wear_v1',wear={},cy=new Date().getFullYear(),cm=new Date().getMonth(),dayKey=null;
try{wear=JSON.parse(localStorage.getItem(WK)||'{}')}catch(e){wear={}}
function saveWear(){try{localStorage.setItem(WK,JSON.stringify(wear))}catch(e){}}
function ds(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function renderCal(){
  var first=new Date(cy,cm,1).getDay(),n=new Date(cy,cm+1,0).getDate(),h='<div class="cal-h"><button data-cm="-1">◀</button><b>'+cy+'年'+(cm+1)+'月</b><button data-cm="1">▶</button></div><div class="cal">';
  ['日','月','火','水','木','金','土'].forEach(function(w){h+='<div class="wd">'+w+'</div>'});
  for(var i=0;i<first;i++)h+='<div></div>';
  for(var d=1;d<=n;d++){var k=ds(cy,cm,d),ids=wear[k]||[],it=ids.length?items.find(function(x){return x.id===ids[0]}):null;
    h+='<div class="cd" data-cd="'+k+'"><span>'+d+'</span>'+(it?(it.i1?'<img src="'+it.i1+'" alt="">':'<i></i>')+'<small>'+esc(it.series||it.brand||'')+'</small><small>'+esc(it.color||'')+'</small>'+(it.cdia?'<small>着色'+esc(it.cdia)+'</small>':''):(ids.length?'<i></i>':''))+(ids.length>1?'<em>+'+(ids.length-1)+'</em>':'')+'</div>'}
  $('list').innerHTML=h+'</div><div class="spec" style="margin:10px 4px">日付をタップして、その日に着けたカラコンを記録してね</div>';
}
$('list').addEventListener('click',function(e){
  var nv=e.target.closest('[data-cm]');if(nv){cm+=Number(nv.dataset.cm);if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}renderCal();return}
  var dd=e.target.closest('[data-cd]');if(dd)openDay(dd.dataset.cd)});
function openDay(k){dayKey=k;var ids=wear[k]||[];$('dvT').textContent=k.replace(/-/g,'/')+' に着けたカラコン';
  var src=items.slice().sort(function(a,b){return (b.own?1:0)-(a.own?1:0)});
  $('dvL').innerHTML=src.length?src.map(function(it){return '<label class="pick"><input type="checkbox" data-pk="'+it.id+'"'+(ids.indexOf(it.id)>-1?' checked':'')+'><div class="thumb">'+(it.i1?'<img src="'+it.i1+'" alt="">':'<span class="noimg">画像<br>なし</span>')+'</div><div class="info"><div class="t">'+esc(it.color||it.brand)+'</div><div class="s">'+esc(it.brand)+'</div></div></label>'}).join(''):'<div class="empty">先にカラコンを登録してね</div>';
  $('dv').classList.add('open')}
$('dvL').addEventListener('change',function(e){var id=e.target.dataset.pk;if(!id)return;var a=wear[dayKey]||[],i=a.indexOf(id);if(e.target.checked){if(i<0)a.push(id)}else if(i>-1)a.splice(i,1);if(a.length)wear[dayKey]=a;else delete wear[dayKey];saveWear()});
function closeDay(){$('dv').classList.remove('open');renderCal()}
$('dvOk').onclick=closeDay;$('dv').onclick=function(e){if(e.target===$('dv'))closeDay()};
var HUES=['ブラウン','ベージュ','グレー','ブラック','ピンク','ブルー','グリーン','ヘーゼル','パープル','レッド','その他'],MATS=['シリコン','ハイドロゲル','その他'];
function opts(a){return '<option value="">未設定</option>'+a.map(function(x){return '<option>'+x+'</option>'}).join('')}
$('fHue').innerHTML=opts(HUES);$('fMat').innerHTML=opts(MATS);
function learnTags(){var c=curTags();c.forEach(function(t){if(allTags().indexOf(t)<0)custom.push(t)});saveCustom();return c}
$('addTag').onclick=function(){var v=$('fNewTag').value.trim().replace(/[,、]/g,'');if(!v)return;if(allTags().indexOf(v)<0){custom.push(v);saveCustom()}var c=curTags();if(c.indexOf(v)<0)c.push(v);$('fTags').value=c.join(',');$('fNewTag').value='';chipSync()};
$('chips').addEventListener('click',function(e){var x=e.target.dataset.cx;if(!x)return;custom=custom.filter(function(t){return t!==x});saveCustom();$('fTags').value=curTags().filter(function(t){return t!==x}).join(',');chipSync()});
var F={brand:'',hue:'',period:'',mat:'',dia:'',cdia:'',bc:'',tag:''},fopen=false;
function passF(it){if(F.brand&&it.brand!==F.brand)return false;if(F.hue&&it.hue!==F.hue)return false;if(F.period&&it.period!==F.period)return false;if(F.mat&&it.mat!==F.mat)return false;if(F.dia&&String(it.dia)!==F.dia)return false;if(F.cdia&&String(it.cdia)!==F.cdia)return false;if(F.bc&&String(it.bc)!==F.bc)return false;if(F.tag&&(it.tags||'').split(',').indexOf(F.tag)<0)return false;return true}
function uniq(k){var s={};items.forEach(function(it){if(it[k]!==''&&it[k]!=null)s[it[k]]=1});return Object.keys(s).sort(function(a,b){var x=parseFloat(a),y=parseFloat(b);return(isNaN(x)||isNaN(y))?a.localeCompare(b,'ja'):x-y})}
function itemTags(){var s={};items.forEach(function(it){(it.tags||'').split(',').forEach(function(t){if(t)s[t]=1})});return Object.keys(s)}
function sel(label,key,o){return '<label class="fl">'+label+'<select data-f="'+key+'"><option value="">すべて</option>'+o.map(function(v){return '<option value="'+esc(v)+'"'+(F[key]===v?' selected':'')+'>'+esc(v)+'</option>'}).join('')+'</select></label>'}
function renderFilter(){
  var q=$('q').value.trim().toLowerCase(),n=Object.keys(F).filter(function(k){return F[k]}).length,
  cnt=items.filter(function(it){return(tab!=='mine'||it.own)&&passF(it)&&(!q||(it.brand+it.series+it.color+(it.tags||'')+(it.maker||'')+(it.shop||'')).toLowerCase().indexOf(q)>-1)}).length;
  $('fbar').innerHTML='<div class="fh"><button type="button" class="fbtn" id="ftog">🔍 絞り込み'+(n?'('+n+')':'')+(fopen?' ▲':' ▼')+'</button>'+(n?'<button type="button" class="fbtn" id="fclr">クリア</button>':'')+'<span class="cnt">'+cnt+'件</span></div>'+(fopen?'<div class="fg">'+sel('ブランド','brand',uniq('brand'))+sel('色系統','hue',uniq('hue'))+sel('直径(DIA)','dia',uniq('dia'))+sel('着色直径','cdia',uniq('cdia'))+sel('BC','bc',uniq('bc'))+sel('装用期間','period',uniq('period'))+sel('素材','mat',uniq('mat'))+sel('タグ','tag',itemTags())+'</div>':'')}
$('fbar').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='ftog'){fopen=!fopen;render()}else if(b.id==='fclr'){Object.keys(F).forEach(function(k){F[k]=''});render()}});
$('fbar').addEventListener('change',function(e){var k=e.target.dataset.f;if(k){F[k]=e.target.value;render()}});
function showImgs(list){if(!list.length)return;$('lbBody').innerHTML=list.map(function(x){return '<div style="color:#fff;font-size:12px;font-weight:700;margin:0 2px 6px">'+x[0]+'</div><img src="'+x[1]+'" alt="" style="width:100%;border-radius:14px;margin-bottom:14px;display:block">'}).join('')+'<div style="color:#ddd;font-size:11px;text-align:center">タップでとじるよ</div>';$('lb').classList.add('open')}
function openImg(id){var it=items.find(function(x){return x.id===id});if(!it)return;var l=[];if(it.i1)l.push(['レンズデザイン',it.i1]);if(it.i2)l.push(['着用イメモ',it.i2]);showImgs(l)}
$('lb').onclick=function(){$('lb').classList.remove('open')};
$('pv1').style.cursor='pointer';$('pv2').style.cursor='pointer';
$('pv1').onclick=function(){if(this.src)showImgs([['レンズデザイン',this.src]])};
$('pv2').onclick=function(){if(this.src)showImgs([['着用イメモ',this.src]])};
var rArmed=false;
$('bk').onclick=function(){var th=null;try{th=localStorage.getItem(TK)}catch(e){}$('boT').value=JSON.stringify({app:'karakon',v:1,items:items,wear:wear,tags:custom,theme:th});$('boMsg').textContent='';rArmed=false;$('boRestore').textContent='復元';$('bo').classList.add('open')};
$('boClose').onclick=function(){$('bo').classList.remove('open')};
$('bo').onclick=function(e){if(e.target===$('bo'))$('bo').classList.remove('open')};
$('boCopy').onclick=function(){var ta=$('boT');ta.select();function ok(){$('boMsg').textContent='コピーしたよ!メモ帳などに貼り付けて保管してね'}function ng(){$('boMsg').textContent='うまくコピーできなかったよ。欄をタップして全選択→コピーしてね'}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(ok,ng)}else if(document.execCommand('copy')){ok()}else{ng()}}catch(e){ng()}};
$('boRestore').onclick=function(){var d;try{d=JSON.parse($('boT').value)}catch(e){$('boMsg').textContent='データの形式が読み取れなかったよ';return}
  if(!d||d.app!=='karakon'||!Array.isArray(d.items)){$('boMsg').textContent='カラコン手帳のバックアップじゃないみたい';return}
  if(!rArmed){rArmed=true;$('boRestore').textContent='本当に復元する?';$('boMsg').textContent='今のデータはこの内容に置き換わるよ。もう一回押すと復元するね';return}
  rArmed=false;$('boRestore').textContent='復元';items=d.items;wear=d.wear||{};custom=Array.isArray(d.tags)?d.tags:[];persist();saveWear();saveCustom();if(d.theme)setTheme(d.theme);$('boMsg').textContent='復元できたよ!';render()};
var fold={};try{fold=JSON.parse(localStorage.getItem('karakon_fold_v1')||'{}')}catch(e){fold={}}
function toggleFold(k){fold[k]=!fold[k];try{localStorage.setItem('karakon_fold_v1',JSON.stringify(fold))}catch(e){}render()}
function cmpB(a,b){if(a===b)return 0;if(!a)return 1;if(!b)return -1;return a.localeCompare(b,'ja')}
function cmpS(a,b){if(a===b)return 0;if(!a)return -1;if(!b)return 1;return a.localeCompare(b,'ja')}
var dvAll=false,dvEditing=false;
function dvThumb(it){return '<div class="thumb">'+(it.i1?'<img src="'+it.i1+'" alt="">':'<span class="noimg">画像<br>なし</span>')+'</div>'}
function dvName(it){return esc(it.series||it.brand||'')}
function openDay(k){dayKey=k;dvEditing=!(wear[k]&&wear[k].length);$('dvT').textContent=k.replace(/-/g,'/')+' に着けたカラコン';$('dvQ').value='';dvAll=false;dvSync();dvRender();$('dv').classList.add('open')}
function dvSync(){$('dvOwn').classList.toggle('on',!dvAll);$('dvAllB').classList.toggle('on',dvAll);$('dvTop').style.display=dvEditing?'block':'none';$('dvEdit').style.display=dvEditing?'none':'block';$('dvOk').textContent=dvEditing?'決定':'とじる'}
function dvRender(){
  var ids=wear[dayKey]||[],box=$('dvL');
  if(!dvEditing){box.innerHTML=ids.map(function(id){var it=items.find(function(x){return x.id===id});return it?'<div class="pick">'+dvThumb(it)+'<div class="info"><div class="t">'+dvName(it)+' '+esc(it.color||'')+'</div><div class="spec">'+(it.cdia?'着色直径 '+esc(it.cdia):'')+'</div></div></div>':''}).join('')||'<div class="empty">記録がないよ</div>';return}
  var q=$('dvQ').value.trim().toLowerCase();
  var src=items.filter(function(it){return(dvAll||it.own||ids.indexOf(it.id)>-1)&&(!q||(it.brand+it.series+it.color).toLowerCase().indexOf(q)>-1)});
  box.innerHTML=src.length?src.map(function(it){return '<label class="pick"><input type="checkbox" data-pk="'+it.id+'"'+(ids.indexOf(it.id)>-1?' checked':'')+'>'+dvThumb(it)+'<div class="info"><div class="t">'+dvName(it)+' '+esc(it.color||'')+'</div><div class="s">'+esc(it.brand)+'</div></div></label>'}).join(''):'<div class="empty">'+(dvAll?'見つからないよ':'所持中のカラコンがないよ<br>「すべて」で図鑑から選べるよ')+'</div>'}
$('dvQ').oninput=dvRender;
$('dvOwn').onclick=function(){dvAll=false;dvSync();dvRender()};
$('dvAllB').onclick=function(){dvAll=true;dvSync();dvRender()};
$('dvEdit').onclick=function(){dvEditing=true;dvSync();dvRender()};
var t='mizuiro';try{t=localStorage.getItem(TK)||'mizuiro'}catch(e){}
(function(){var c=document.getElementById('spk');if(!c)return;var ch=['\u2726','\u2727','\u2728','\u22c6','\u2661'];for(var i=0;i<16;i++){var e=document.createElement('i');e.className='sp';e.textContent=ch[i%ch.length];e.style.left=(Math.random()*96)+'%';e.style.top=(Math.random()*96)+'%';e.style.fontSize=(8+Math.random()*12)+'px';e.style.animationDelay=(Math.random()*4)+'s';e.style.animationDuration=(2.5+Math.random()*3)+'s';c.appendChild(e)}})();
try{if(!localStorage.getItem('karakon_bijou_v1')){localStorage.setItem('karakon_bijou_v1','1');t='bijou'}}catch(e){}
setTheme('bijou');load();render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
